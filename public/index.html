<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>实时公交 · Bus Live</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{
    --bg:#0e1621; --panel:#16212e; --card:#1c2a3a; --line:#2a3b4f;
    --txt:#e8eef4; --sub:#8fa3b8; --accent:#ff6b35;
    --free:#2ecc71; --mid:#f1c40f; --crowd:#e74c3c;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--txt);}
  #app{display:flex; height:100%;}
  #map{flex:1; min-width:0;}
  #panel{width:360px; min-width:360px; background:var(--panel); border-left:1px solid var(--line);
    display:flex; flex-direction:column; overflow:hidden;}
  /* 顶部横幅 */
  .hd{padding:14px 18px; border-bottom:1px solid var(--line); background:linear-gradient(180deg,#1d2c3e,#16212e);}
  .hd .row{display:flex; align-items:baseline; gap:10px;}
  .hd .line{font-size:22px; font-weight:800; color:var(--accent);}
  .hd .dir{font-size:13px; color:var(--sub);}
  .hd .stop{font-size:14px; margin-top:6px;}
  .hd .stop b{color:#fff;}
  .hd .meta{margin-top:4px; font-size:12px; color:var(--sub);}
  /* 右侧来车列表 */
  .list{flex:1; overflow-y:auto; padding:12px;}
  .empty{padding:30px 12px; text-align:center; color:var(--sub); font-size:14px;}
  .card{background:var(--card); border-radius:10px; padding:12px 14px; margin-bottom:10px;
    border-left:4px solid var(--accent);}
  .card .top{display:flex; justify-content:space-between; align-items:center;}
  .card .plate{font-weight:700; font-size:15px; color:#fff;}
  .card .badge{padding:2px 8px; border-radius:12px; font-size:11px; font-weight:600; color:#04230f;}
  .badge.free{background:var(--free);} .badge.mid{background:var(--mid);} .badge.crowd{background:var(--crowd); color:#fff;}
  .card .figs{display:flex; gap:18px; margin-top:10px;}
  .fig .num{font-size:22px; font-weight:800;}
  .fig .lab{font-size:11px; color:var(--sub);}
  .fig .subv{font-size:12px; color:var(--sub);}
  .card .dist{font-size:12px; color:var(--sub); margin-top:8px;}
  /* 底部刷新状态 */
  .ft{padding:10px 18px; border-top:1px solid var(--line); font-size:12px; color:var(--sub);
    display:flex; justify-content:space-between; align-items:center;}
  .ft .dot{width:8px; height:8px; border-radius:50%; background:var(--free); display:inline-block; margin-right:6px;}
  .ft .dot.stale{background:var(--crowd);}
  /* 地图图例 */
  .legend{position:absolute; bottom:20px; left:10px; z-index:800; background:rgba(14,22,33,.85);
    border-radius:8px; padding:8px 12px; font-size:12px; color:var(--sub); border:1px solid var(--line);}
  .legend .item{display:flex; align-items:center; gap:6px; margin:3px 0;}
  .sw{width:12px; height:12px; border-radius:3px; display:inline-block;}
  h3.section{font-size:12px; color:var(--sub); letter-spacing:1px; padding:4px 4px 8px;}

  /* 车辆地图图标 */
  .bus-pin{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    width:40px; height:40px; border-radius:50%;
    background:rgba(14,22,33,.9); border:2px solid #fff;
    box-shadow:0 2px 8px rgba(0,0,0,.5);
    cursor:pointer; transition:transform .15s, box-shadow .15s, border-color .15s;
  }
  .bus-pin:hover{transform:scale(1.12);}
  .bus-pin .cap{
    width:12px; height:12px; border-radius:50%; border:1.5px solid #fff;
    position:absolute; top:-2px; right:-2px;
  }
  .bus-pin .stops{
    font-size:11px; font-weight:700; color:#fff; line-height:1;
    text-shadow:0 1px 1px rgba(0,0,0,.6);
  }
  .bus-pin .ic{font-size:18px; line-height:1;}
  .bus-pin.sel{
    transform:scale(1.3); z-index:1000 !important;
    box-shadow:0 0 0 4px rgba(255,107,53,.5), 0 4px 14px rgba(0,0,0,.7);
  }
  .bus-pin.passed{opacity:.45; cursor:default;}
  .bus-pin.passed:hover{transform:none;}

  /* 车辆 popup 信息卡 */
  .bus_pop .tt{font-weight:700; font-size:15px; margin-bottom:2px; color:#0e1621;}
  .bus_pop .caprow{font-size:13px; margin:2px 0; color:#333;}
  .bus_pop .row{display:flex; justify-content:space-between; font-size:12px; color:#555; margin-top:2px;}
  .bus_pop .big{font-size:16px; font-weight:800; color:#ff6b35;}

  /* 右侧卡片选中态 */
  .card{cursor:pointer; transition:transform .12s, box-shadow .12s, background .12s;}
  .card:hover{transform:translateX(4px); background:#22334a;}
  .card.selected{border-left-color:#fff; box-shadow:0 0 0 2px rgba(255,107,53,.6); background:#25405c;}
</style>
</head>
<body>
<div id="app">
  <div id="map">
    <div class="legend">
      <h3 class="section">车辆拥挤度</h3>
      <div class="item"><span class="sw" style="background:var(--free)"></span> 畅通</div>
      <div class="item"><span class="sw" style="background:var(--mid)"></span> 适中</div>
      <div class="item"><span class="sw" style="background:var(--crowd)"></span> 拥挤</div>
      <div class="item" style="margin-top:6px;color:var(--txt)">🚌 行驶方向 · 线路轨迹描线</div>
    </div>
  </div>
  <div id="panel">
    <div class="hd">
      <div class="row">
        <span class="line" id="hLine">--</span>
        <span class="dir" id="hDir"></span>
      </div>
      <div class="stop">候车站：<b id="hStop">--</b> <span id="hStopOrder" style="color:var(--sub);font-size:12px"></span></div>
      <div class="meta" id="hMeta"></div>
    </div>
    <div class="list" id="busList">
      <div class="empty">正在获取实时数据…</div>
    </div>
    <div class="ft">
      <span><span class="dot" id="statusDot"></span><span id="statusTxt">连接中…</span></span>
      <span id="timeTxt"></span>
    </div>
  </div>
</div>

<script>
(() => {
  const POLL_MS = 5000;
  // 初始视野是中国全图，首次数据到达后 fitBounds 到线路，之后用户自由缩放
  const map = L.map('map').setView([35, 105], 4);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '&copy; OpenStreetMap',
  }).addTo(map);

  // 图层：线路/站点改原地更新复用；车辆用 busMarkers 维护 map
  let lineLayer = null;           // L.polyline（setLatLngs 原位更新）
  let stopLayer = L.layerGroup().addTo(map);  // 站点 marker 组
  let hasFit = false;             // 是否已做过首屏 fitBounds（fit 后永不主动动 view）
  const stopMarkers = {};         // order -> L.marker（站点原地 update）
  const busMarkers = {};          // busId -> { marker, selFlag }
  let selectedBusId = null;       // 当前选中车辆

  // 页面头部：线路/站点信息由后端数据动态注入（不写死在 HTML）
  function updateHeader(d) {
    const data = d || {};
    const cfg = data.cfg || {};
    const line = data.line || {};
    const tgt = data.targetStop || {};
    document.getElementById('hLine').textContent = cfg.lineNo || line.name || '--';
    document.getElementById('hDir').textContent = (line.startSn || '') + ' → ' + (line.endSn || '');
    document.getElementById('hStop').textContent = tgt.sn || cfg.stopName || '--';
    document.getElementById('hStopOrder').textContent = tgt.order ? `第 ${tgt.order} 站` : '';
    document.getElementById('hMeta').textContent =
      `${line.firstTime ? '首班 ' + line.firstTime : ''}${line.lastTime ? ' · 末班 ' + line.lastTime : ''}${cfg.cityName ? ' · ' + cfg.cityName : ''}`.trim();
    // 浏览器标题
    if (cfg.lineNo && tgt.sn) document.title = `${cfg.lineNo} · ${tgt.sn} · 实时公交`;
  }

  function capLabel(c) { return c === 3 ? '拥挤' : c === 2 ? '偏挤' : c === 1 ? '适中' : '畅通'; }
  function capClass(c) { return c >= 3 ? 'crowd' : c === 2 ? 'crowd' : c === 1 ? 'mid' : 'free'; }
  function capColor(c) { return c >= 2 ? '#e74c3c' : c === 1 ? '#f1c40f' : '#2ecc71'; }
  const capEmoji = { 0: '🟢', 1: '🟡', 2: '🔴', 3: '🔴' };

  // 车辆地图图标：拥挤度色点 + 剩余站数徽章；选中态由 selectBus 切换 class
  function busPinHtml(b, selected) {
    const c = capColor(b.crowd);
    const stops = (b.passed) ? '已过' : (b.stopsToArrive != null ? `${b.stopsToArrive}站` : '');
    const cls = 'bus-pin' + (selected ? ' sel' : '') + (b.passed ? ' passed' : '');
    return `<div class="${cls}">
      <span class="cap" style="background:${c}"></span>
      <span class="ic">🚌</span>
      <span class="stops">${stops}</span>
    </div>`;
  }

  // 车辆 popup 详情卡（点击车辆后展示）
  function busPopupHtml(b) {
    const eta = b.etaSec != null
      ? `<span class="big">${b.etaMin} 分钟</span>`
      : (b.distanceToWaitStn > 0 ? `<span class="big">约 ${(b.distanceToWaitStn / 1000).toFixed(1)} km</span>` : `<span class="big">即将进站</span>`);
    const stopsTxt = b.stopsToArrive != null ? `${b.stopsToArrive} 站` : '—';
    const etaTime = b.etaTime ? b.etaTime : '';
    return `<div class="bus_pop">
      <div class="tt">🚌 ${b.licence || b.busId}</div>
      <div class="caprow">${capEmoji[b.crowd] ?? '⚪'} ${capLabel(b.crowd)} <span style="color:#999;font-size:11px">${capColor(b.crowd) === '#2ecc71' ? '· 比较宽松' : capColor(b.crowd) === '#f1c40f' ? '· 中等' : '· 有点挤'}</span></div>
      <div class="row"><span>剩余站数</span><span><b>${stopsTxt}</b></span></div>
      <div class="row"><span>到达时间</span><span>${eta} ${etaTime ? '<span style="color:#666">· ' + etaTime + ' 到</span>' : ''}</span></div>
      <div class="row"><span>当前速度</span><span>${b.speed || 0} km/h</span></div>
      <div class="row"><span>距候车站</span><span>${(b.distanceToWaitStn / 1000).toFixed(1)} km</span></div>
      ${b.passed ? `<div class="row" style="color:#888"><span>状态</span><span>已驶过候车站</span></div>` : ''}
    </div>`;
  }

  function renderMap(d) {
    const data = d || {};
    // 线路轨迹：原地替换坐标，不重建（避免触发视图相关事件）
    if (data.route && data.route.length) {
      if (lineLayer) {
        // 只更新坐标，不改 view；关闭 Leaflet 内部的 bounds 跟踪，避免被 fitBounds
        lineLayer.setLatLngs(data.route);
      } else {
        lineLayer = L.polyline(data.route, { color: '#ff6b35', weight: 3, opacity: .65, updateBounds: false }).addTo(map);
      }
      // 首屏一次性 fit 到线路；fit 后绝不主动动用户 view
      if (!hasFit) { map.fitBounds(lineLayer.getBounds(), { padding: [40, 40] }); hasFit = true; }
    } else if (lineLayer) {
      map.removeLayer(lineLayer); lineLayer = null;
    }
    // 站点：stopMarkers 原地更新坐标；只在首次/新增时建 marker
    const seen = new Set();
    (data.stations || []).forEach((s) => {
      seen.add(s.order);
      const isTgt = data.targetStop && s.order === data.targetStop.order;
      if (stopMarkers[s.order]) {
        stopMarkers[s.order].setLatLng([s.lat, s.lng]);
        const ic = stopMarkers[s.order].getIcon();
        // 目标站可能与普通站图标不同，首次建好即可，此处不改 icon
        void ic;
      } else {
        const ic = L.divIcon({
          className: '',
          html: isTgt
            ? `<div style="width:16px;height:16px;border-radius:50%;background:#ff6b35;border:3px solid #fff;box-shadow:0 0 0 3px rgba(255,107,53,.4)"></div>`
            : `<div style="width:9px;height:9px;border-radius:50%;background:#6b8299;border:1.5px solid #fff"></div>`,
          iconSize: isTgt ? [16, 16] : [9, 9], iconAnchor: isTgt ? [8, 8] : [4.5, 4.5],
        });
        stopMarkers[s.order] = L.marker([s.lat, s.lng], { icon: ic })
          .bindTooltip(`${s.order}. ${s.sn}`, { direction: 'top', offset: isTgt ? [0, -8] : [0, -4] })
          .addTo(stopLayer);
      }
    });
    // 清理不存在的站点
    Object.keys(stopMarkers).forEach((o) => { if (!seen.has(Number(o))) { stopLayer.removeLayer(stopMarkers[o]); delete stopMarkers[o]; } });
  }

  // ---------- 车辆双向联动 ----------
  function selectBus(busId, opts = {}) {
    // 再次点击已选 → 取消
    if (selectedBusId === busId && !opts.force) {
      selectedBusId = null;
    } else {
      selectedBusId = busId;
    }
    applySelection();
    if (selectedBusId) {
      const b = currentBuses[selectedBusId];
      if (b && !opts.silent) {
        // zoom 到车辆：如果用户当前缩放<14 则 flyTo 放大，否则保持但保证可见
        const cur = map.getZoom();
        map.flyTo([b.lat, b.lng], Math.max(cur, 15), { duration: .5 });
      }
    }
  }

  function applySelection() {
    // 地图图标选中态
    Object.entries(busMarkers).forEach(([id, m]) => {
      const el = m.marker.getElement();
      if (!el) return;
      if (id === selectedBusId) el.classList.add('sel');
      else el.classList.remove('sel');
    });
    // 右侧卡片选中态
    document.querySelectorAll('.card').forEach((c) => {
      c.classList.toggle('selected', c.dataset.busId === selectedBusId);
    });
  }

  // 渲染公交列表 + 更新/创建 bus markers（原地增改删，不重建）
  let currentBuses = {};  // busId -> bus
  const lastBusesCache = new Map();

  function renderBuses(d) {
    const list = document.getElementById('busList');
    const data = d || {};
    const busArr = data.buses || [];
    const incoming = new Set(busArr.map((b) => b.busId));
    currentBuses = {};
    busArr.forEach((b) => { currentBuses[b.busId] = b; });

    // ---- 地图车辆 markers 原地更新 ----
    // 移除消失的车
    Object.keys(busMarkers).forEach((id) => {
      if (!incoming.has(id)) {
        map.removeLayer(busMarkers[id].marker);
        delete busMarkers[id];
      }
    });
    // 更新/新建
    busArr.forEach((b) => {
      const selected = selectedBusId === b.busId;
      if (busMarkers[b.busId]) {
        const m = busMarkers[b.busId].marker;
        m.setLatLng([b.lat, b.lng]);
        // 刷新图标（拥挤度/剩余站数可能变）
        const wasSel = b.busId === selectedBusId;
        m.setIcon(divIconBus(b, wasSel));
      } else {
        const mk = L.marker([b.lat, b.lng], {
          icon: divIconBus(b, selected),
          title: b.licence || b.busId,
        });
        mk.on('click', () => {
          // 点击地图车辆图标 → 选中并弹详情
          if (selectedBusId === b.busId) { selectedBusId = null; applySelection(); return; }
          selectedBusId = b.busId;
          applySelection();
          mk.bindPopup(busPopupHtml(b), { className: 'bus_popup' }).openPopup();
          const cur = map.getZoom();
          map.flyTo([b.lat, b.lng], Math.max(cur, 15), { duration: .5 });
        });
        mk.addTo(map);
        busMarkers[b.busId] = { marker: mk };
      }
    });

    // ---- 右侧面板 ----
    if (!busArr.length) {
      list.innerHTML = `<div class="empty">当前线路上暂无运行中的车辆<br><span style="font-size:12px;color:var(--sub)">可能是末班已过或调度间隙，稍候自动刷新</span></div>`;
    } else {
      list.innerHTML = busArr.map((b) => {
        const sel = b.busId === selectedBusId ? ' selected' : '';
        if (b.passed) {
          return `<div class="card${sel}" data-bus-id="${b.busId}" style="border-left-color:#56677b;opacity:.75" onclick="window.__selBus('${b.busId}')">
            <div class="top">
              <span class="plate">🚌 ${b.licence || b.busId}</span>
              <span class="badge ${capClass(b.crowd)}">${capEmoji[b.crowd] ?? '⚪'} ${capLabel(b.crowd)}</span>
            </div>
            <div class="dist" style="margin-top:4px">✅ 已驶过候车站</div>
          </div>`;
        }
        const eta = b.etaSec != null
          ? `${b.etaMin} 分钟`
          : (b.distanceToWaitStn > 0 ? `约 ${(b.distanceToWaitStn / 1000).toFixed(1)} km` : '即将进站');
        const etaSub = b.etaTime ? `预计 ${b.etaTime}` : '';
        const stopsTxt = b.stopsToArrive != null ? `${b.stopsToArrive} 站` : '--';
        return `<div class="card${sel}" data-bus-id="${b.busId}" onclick="window.__selBus('${b.busId}')">
          <div class="top">
            <span class="plate">🚌 ${b.licence || b.busId}</span>
            <span class="badge ${capClass(b.crowd)}">${capEmoji[b.crowd] ?? '⚪'} ${capLabel(b.crowd)}</span>
          </div>
          <div class="figs">
            <div class="fig"><div class="num">${stopsTxt}</div><div class="lab">剩余站数</div></div>
            <div class="fig"><div class="num" style="font-size:20px">${eta}</div><div class="lab">抵达 <span class="subv">${etaSub}</span></div></div>
            <div class="fig"><div class="num" style="font-size:18px;color:var(--sub)">${b.speed || 0} km/h</div><div class="lab">当前速度</div></div>
          </div>
          <div class="dist">距本站 ${(b.distanceToWaitStn / 1000).toFixed(1)} 公里 · 当前行驶方向</div>
        </div>`;
      }).join('');
    }

    // 底部状态
    const dot = document.getElementById('statusDot');
    const txt = document.getElementById('statusTxt');
    const timeTxt = document.getElementById('timeTxt');
    if (data.stale) { dot.className = 'dot stale'; txt.textContent = '数据源暂不可用 · 显示旧数据'; }
    else { dot.className = 'dot'; txt.textContent = '实时刷新中'; }
    timeTxt.textContent = data.fetchedAt
      ? new Date(data.fetchedAt).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' })
      : '';
  }

  // divIcon：车辆图标（含拥挤色点 + 剩余站数徽章），selected 时加 sel 类
  function divIconBus(b, selected) {
    return L.divIcon({
      className: '',
      html: busPinHtml(b, selected),
      iconSize: [0, 0],   // div 自适应，不裁剪
      iconAnchor: [20, 20],
      popupAnchor: [0, -20],
    });
  }

  async function poll2() {
    try {
      const r = await fetch('/api/line', { cache: 'no-store' });
      const d = await r.json();
      updateHeader(d);
      renderMap(d);
      renderBuses(d);
      if (selectedBusId) applySelection();
    } catch (e) {
      document.getElementById('statusDot').className = 'dot stale';
      document.getElementById('statusTxt').textContent = '后端连接失败';
    }
  }

  // 供卡片 onclick 使用（window 作用域）
  window.__selBus = (id) => selectBus(id);

  poll2();
  setInterval(poll2, POLL_MS);
})();
</script>
</body>
</html>
